services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: church
      POSTGRES_PASSWORD: church
      POSTGRES_DB: church_manager
    volumes:
      - church_manager_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U church -d church_manager"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env.docker
    environment:
      DATABASE_URL: postgresql://church:church@db:5432/church_manager
      PORT: "3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  # Túnel HTTPS para webhooks Asaas em dev (opcional). Ver docker/README.md e docs/webhooks-local-dev-ngrok.md
  ngrok:
    image: ngrok/ngrok:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    # Token lido de .env.docker (evita ${NGROK_AUTHTOKEN} no YAML e o aviso do compose ao correr logs sem .env)
    env_file:
      - .env.docker
    command: ["http", "--log=stdout", "http://api:3000"]
    ports:
      - "4040:4040"

  # pgAdmin 4 — só dev local. Não uses em produção exposto à internet.
  pgadmin:
    image: dpage/pgadmin4:latest
    profiles: ["pgadmin"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@church.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - church_manager_pgadmin:/var/lib/pgadmin

volumes:
  church_manager_pgdata:
  church_manager_pgadmin:
