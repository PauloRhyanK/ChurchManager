<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel do culto — Ponte do Culto</title>
<style>
/* O PAINEL DO CULTO.

   UMA TELA SO, e a mesma em tres lugares: no PC da igreja, no celular e na
   versao web. Tudo que ela mostra vem de /api/painel; tudo que ela faz vai
   para /api/painel/acao. Na web esses dois enderecos existem com o mesmo
   nome e o mesmo formato, e e por isso que este arquivo nao sabe (nem
   precisa saber) onde esta rodando, alem do campo `local` do retrato.

   A REGRA DO DESENHO: a pergunta "onde o culto esta e o que eu faco agora"
   se responde sem ler. O momento atual e a maior coisa da tela, o proximo e
   o maior botao. O que se mexe fora da ordem esta em tres cartoes por
   assunto, e cada botao diz o que faz em portugues de gente.

   Tema escuro fixo: a cabine fica no escuro, e tela clara vira refletor. */
:root{
  --fundo:#0b1016; --caixa:#131b24; --caixa2:#18212c; --fundo2:#0f161e; --linha:#243040; --borda:#3a4757;
  --texto:#e8eef6; --suave:#b9c6d6; --apagado:#8fa0b4;
  --ok:#22c55e; --ok-fundo:#0d2a18; --ok-texto:#6ee7a0; --ok-borda:#1f6b3c; --ok-tinta:#06210f;
  --erro-fundo:#2a1114; --erro-texto:#f8a5a5; --erro-borda:#7a2626;
  --aviso:#f59e0b; --aviso-fundo:#2a1d07; --aviso-texto:#f7d9a3; --aviso-borda:#6b4a12;
  --marca:#2563eb; --marca-texto:#a9c9ff; --vivo:#dc2626;
  /* A altura dos botoes. No PC, com mouse, 40 deixa o painel inteiro caber
     numa tela sem rolar nem tirar o zoom (pedido do Paulo em 12/11, depois de
     ver a primeira versao no ar). No dedo, 46. */
  --alt:40px;
}
@media (pointer:coarse){ :root{--alt:46px} }
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fundo);color:var(--texto);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
a{color:var(--marca-texto)}
button,select{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,a:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #60a5fa;outline-offset:2px}
h1,h2,h3,p{margin:0}
[hidden]{display:none!important}

.tela{max-width:1440px;margin:0 auto;padding:max(10px,env(safe-area-inset-top)) clamp(12px,1.8vw,24px) 14px;
  display:flex;flex-direction:column;gap:10px}
.topo{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.topo .nome{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.topo h1{font-size:18px;font-weight:800;letter-spacing:-.01em}
.topo .sub{font-size:14px;color:var(--suave);font-variant-numeric:tabular-nums}
.pilulas{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto;align-items:center}
.pilula{display:inline-flex;align-items:center;gap:8px;min-height:28px;padding:2px 10px;border-radius:999px;
  background:var(--caixa);border:1px solid var(--linha);font-size:12.5px;color:var(--suave)}
.pilula i{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.pilula.erro{background:var(--aviso-fundo);border-color:var(--aviso-borda);color:var(--aviso-texto)}
.pilula.erro i{background:var(--aviso);border-radius:2px}
.pilula.desligado i{background:#5b6b7e}

.bt{min-height:var(--alt);padding:0 14px;border-radius:11px;border:1px solid var(--borda);background:var(--caixa2);
  color:var(--texto);font-size:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;
  text-align:center;text-decoration:none}
.bt.perigo{border-color:var(--erro-borda);background:var(--erro-fundo);color:var(--erro-texto);font-weight:700}
.bt.forte{background:var(--marca);border-color:transparent;color:#fff;font-weight:700}
.bt.aviso{background:var(--aviso);border-color:transparent;color:#1f1300;font-weight:700}
.bt.largo{width:100%}

.faixa{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;border-radius:12px;padding:7px 12px;font-size:14px}
.faixa > span{flex:1 1 260px}
.faixa.erro{background:var(--erro-fundo);border:1px solid var(--erro-borda);color:var(--erro-texto)}
.faixa.aviso{background:var(--aviso-fundo);border:1px solid var(--aviso-borda);color:var(--aviso-texto)}
.faixa.nota{background:#10213f;border:1px solid #284a86;color:var(--marca-texto)}
.faixa b{color:#fff}

.duas{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
.principal{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:10px}
.lado{flex:1 1 340px;max-width:430px;min-width:0;display:flex;flex-direction:column;gap:10px}
@media (max-width:820px){.lado{max-width:none}}

.cartao{background:var(--caixa);border:1px solid var(--linha);border-radius:16px;padding:12px 14px;
  display:flex;flex-direction:column;gap:9px}
.cartao h2{font-size:15.5px;font-weight:700}
.cabeca{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px}
.rotulo{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--apagado)}
.miudo{font-size:12.5px;color:var(--apagado)}
.umalinha{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.linha{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 12px}
.linha > span{font-size:14px;color:var(--suave)}
.linha b{color:var(--texto)}
.corte{border-top:1px solid var(--linha);padding-top:9px}

.agora{border-radius:18px;padding:14px 16px;gap:10px}
.agora .titulo{display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px 18px}
.agora h2{font-size:clamp(32px,4.2vw,44px);font-weight:800;letter-spacing:-.03em;line-height:1}
.agora .quando{font-size:14px;color:var(--suave);padding-bottom:4px}
.fatos{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.fato{background:var(--caixa2);border-radius:12px;padding:8px 12px;display:flex;flex-direction:column;gap:1px;min-width:0}
.fato .rotulo{font-size:11px}
.fato strong{font-size:17px;font-weight:700;overflow-wrap:anywhere}
.fato span:last-child{font-size:13px;color:var(--suave)}
.proximo{min-height:70px;width:100%;border:none;border-radius:14px;background:var(--ok);color:var(--ok-tinta);
  padding:10px 18px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 24px;text-align:left}
.proximo .a{display:flex;flex-direction:column;gap:2px}
.proximo .a small{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.proximo .a b{font-size:clamp(22px,2.8vw,28px);font-weight:800;letter-spacing:-.02em;line-height:1.05}
.proximo .b{font-size:13.5px;font-weight:600;max-width:420px}
.proximo.fim{background:var(--caixa2);color:var(--suave);border:1px solid var(--borda)}

.momentos{display:grid;grid-template-columns:repeat(auto-fit,minmax(98px,1fr));gap:6px}
.momento{min-height:calc(var(--alt) + 8px);border-radius:12px;border:1px solid var(--borda);background:var(--caixa2);color:var(--texto);
  padding:5px 10px;text-align:left;display:flex;flex-direction:column;gap:0}
.momento small{font-size:11px;color:var(--suave)}
.momento b{font-size:14.5px;font-weight:700;overflow-wrap:anywhere}
.momento.feito{background:var(--fundo2);border-color:var(--linha);color:var(--apagado)}
.momento.feito small{color:var(--apagado)}
.momento.atual{border:2px solid var(--ok);background:var(--ok-fundo)}
.momento.atual small{color:var(--ok-texto);font-weight:700}
.momento.serio{border-color:var(--erro-borda);background:var(--erro-fundo);color:var(--erro-texto)}
.momento.serio small{color:var(--erro-texto)}

.grade{display:grid;gap:6px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.escolha{min-height:var(--alt);border-radius:10px;border:1px solid var(--borda);background:var(--caixa2);color:var(--texto);
  font-size:13.5px;font-weight:600;padding:3px 6px;overflow-wrap:anywhere}
.escolha[aria-pressed="true"]{border:2px solid var(--ok);background:var(--ok-fundo);font-weight:700}
.selo{display:inline-flex;align-items:center;gap:8px;min-height:26px;padding:1px 10px;border-radius:999px;
  font-size:13px;font-weight:800;letter-spacing:.04em}
.selo.vivo{background:var(--vivo);color:#fff}
.selo.vivo i{width:8px;height:8px;border-radius:50%;background:#fff}
.selo.fora{background:var(--caixa2);color:var(--suave);border:1px solid var(--borda)}
.par{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:1px solid var(--borda);border-radius:12px;overflow:hidden}
.par button{min-height:var(--alt);border:none;background:var(--caixa2);color:var(--suave);font-size:14px;font-weight:600;padding:4px 8px}
.par button[aria-pressed="true"]{background:var(--marca);color:#fff;font-weight:700}

.rodape{display:flex;flex-direction:column;gap:0;padding:0;overflow:hidden}
.rodape summary{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:6px 14px;cursor:pointer;list-style:none;min-height:var(--alt)}
.rodape summary::-webkit-details-marker{display:none}
.rodape summary i{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.rodape summary i.ruim{background:var(--aviso);border-radius:2px}
.rodape summary span{flex:1 1 260px;font-size:13.5px;color:var(--suave)}
.rodape summary em{font-style:normal;font-size:14px;font-weight:600;color:var(--marca-texto)}
.rodape ol{list-style:none;margin:0;padding:0 16px 14px;display:flex;flex-direction:column;gap:8px}
.rodape li{font-size:14px;color:var(--suave);border-top:1px solid var(--linha);padding-top:8px}
.rodape li.ruim{color:var(--aviso-texto)}

.menu{position:relative}
.menu > summary{list-style:none}
/* O movimento da luz fica recolhido: o que esta ligado aparece na linha, e a
   lista inteira so quando alguem vai trocar. */
.dobra > summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:var(--alt);
  padding:0 12px;border:1px solid var(--borda);border-radius:10px;background:var(--caixa2);cursor:pointer;font-size:14px;color:var(--suave)}
.dobra > summary::-webkit-details-marker{display:none}
.dobra > summary b{color:var(--texto)}
.dobra > summary em{font-style:normal;font-weight:600;color:var(--marca-texto);font-size:13px}
.dobra[open] > summary{margin-bottom:6px}
.menu > summary::-webkit-details-marker{display:none}
.menu .folha{position:absolute;right:0;top:calc(100% + 8px);z-index:20;width:min(340px,calc(100vw - 28px));
  background:var(--caixa);border:1px solid var(--borda);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px;
  box-shadow:0 18px 40px rgba(0,0,0,.5)}
.menu .folha a,.menu .folha .item{display:flex;align-items:center;min-height:44px;padding:0 10px;border-radius:10px;
  color:var(--texto);text-decoration:none;font-size:15px;font-weight:600}
.menu .folha a:hover{background:var(--caixa2)}
.menu .folha label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--apagado);padding:6px 10px}
.menu .folha select{min-height:44px;border-radius:10px;border:1px solid var(--borda);background:var(--fundo);padding:0 10px;font-size:15px}
.menu .folha .bloco{border-top:1px solid var(--linha);margin-top:4px;padding:10px 10px 4px;display:flex;flex-direction:column;gap:8px}
.menu .pcs{font-size:13px;color:var(--suave);display:flex;flex-direction:column;gap:4px}
.menu .pcs b{color:var(--texto)}

dialog{border:1px solid var(--borda);border-radius:18px;background:var(--caixa);color:var(--texto);padding:22px;
  width:min(460px,calc(100vw - 28px))}
dialog::backdrop{background:rgba(3,6,10,.72)}
dialog h2{font-size:22px;font-weight:800;margin-bottom:8px}
dialog p{color:var(--suave);font-size:16px;margin-bottom:18px}
dialog .botoes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.aviso-flutuante{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:40;
  max-width:min(560px,calc(100vw - 24px));background:#0d2a18;border:1px solid var(--ok-borda);color:var(--ok-texto);
  border-radius:14px;padding:12px 18px;font-size:15px;font-weight:600;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.aviso-flutuante.ruim{background:var(--erro-fundo);border-color:var(--erro-borda);color:var(--erro-texto)}
</style>
</head>
<body>
<div class="tela">
  <header class="topo">
    <div class="nome">
      <h1>Ponte do Culto</h1>
      <span class="sub" id="subtitulo">carregando…</span>
    </div>
    <div class="pilulas" id="pilulas"></div>
    <details class="menu" id="menu">
      <summary class="bt">Mais</summary>
      <div class="folha" id="folha"></div>
    </details>
  </header>

  <div id="faixas" style="display:flex;flex-direction:column;gap:10px"></div>

  <div class="duas">
    <main class="principal">
      <section class="cartao agora" id="agora" aria-live="polite"></section>
      <section id="ordem" style="display:flex;flex-direction:column;gap:10px"></section>
      <details class="cartao rodape" id="historico"></details>
    </main>
    <aside class="lado">
      <section class="cartao" id="cartao-transmissao" hidden></section>
      <section class="cartao" id="cartao-luz" hidden></section>
      <section class="cartao" id="cartao-telao" hidden></section>
    </aside>
  </div>
</div>

<dialog id="dialogo" aria-labelledby="dialogo-titulo">
  <h2 id="dialogo-titulo"></h2>
  <p id="dialogo-texto"></p>
  <div class="botoes">
    <button type="button" class="bt" id="dialogo-nao">Cancelar</button>
    <button type="button" class="bt forte" id="dialogo-sim">Confirmar</button>
  </div>
</dialog>
<div class="aviso-flutuante" id="aviso" role="status" hidden></div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const esc = t => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let D = null;            // o ultimo retrato
let semContato = 0;      // quantas consultas seguidas falharam
let ocupado = false;     // ha um pedido em curso
let movimentoAberto = false;   // a lista de movimentos da luz esta aberta
const jaPintado = {};    // id do elemento -> html, para so mexer no que mudou

function pintar(id, html) {
  if (jaPintado[id] === html) return;
  jaPintado[id] = html;
  $(id).innerHTML = html;
}
function mostrar(id, sim) { $(id).hidden = !sim; }

/* Um botao de acao: o que ele pede vai escrito nele mesmo (data-acao), e o
   que precisa de confirmacao leva tambem a pergunta. Um unico ouvinte, la
   embaixo, cuida de todos. */
function botao(rotulo, acao, opcoes) {
  const o = opcoes || {};
  const attrs = [
    'type="button"',
    'class="' + (o.classe || 'bt') + '"',
    "data-acao='" + esc(JSON.stringify(acao)) + "'",
  ];
  if (o.confirmar) attrs.push("data-confirmar='" + esc(JSON.stringify(o.confirmar)) + "'");
  if (o.apertado != null) attrs.push('aria-pressed="' + (o.apertado ? 'true' : 'false') + '"');
  if (o.atual) attrs.push('aria-current="step"');
  if (!podeAgir()) attrs.push('disabled');
  return '<button ' + attrs.join(' ') + '>' + rotulo + '</button>';
}
function podeAgir() {
  if (!D || ocupado || semContato > 2) return false;
  if (D.local) return true;
  return !!D.viva && !!(D.remoto && D.remoto.aceita);
}
function tempo(ms) {
  if (ms == null) return '';
  const min = Math.floor(ms / 60000);
  return min < 60 ? min + ' min' : Math.floor(min / 60) + ' h ' + String(min % 60).padStart(2, '0');
}

// ---------------------------------------------------------------- desenhar --
function desenhar() {
  const d = D;
  const ordem = d.ordem || {momentos: []};
  const momentos = ordem.momentos || [];
  const atual = ordem.atual == null ? null : momentos[ordem.atual];
  const proximo = momentos.find(m => m.id === ordem.proximo_id) || null;

  $('subtitulo').textContent = [ordem.nome, d.hora].filter(Boolean).join(' · ') || 'sem ordem de culto';

  pintar('pilulas', (d.sistemas || []).map(s =>
    '<span class="pilula ' + esc(s.estado) + '" title="' + esc(s.detalhe || '') + '"><i aria-hidden="true"></i>' +
    esc(s.nome) + (s.estado === 'erro' ? ': ' + esc(s.rotulo || 'sem resposta') : s.estado === 'desligado' ? ': desligado' : '') + '</span>').join(''));

  desenharFaixas(d);
  desenharMenu(d);

  // AGORA
  const tr = d.transmissao, tl = d.telao, lz = d.luz;
  let html = '<div class="titulo"><div style="display:flex;flex-direction:column;gap:4px"><span class="rotulo">Agora</span><h2>' +
    esc(atual ? atual.nome : 'Antes de começar') + '</h2></div>' +
    (atual ? '<span class="quando">momento ' + (ordem.atual + 1) + ' de ' + momentos.length + '</span>' : '') + '</div>';
  const fatos = [];
  if (tr) fatos.push(['Na transmissão', tr.imagem || 'sem imagem', tr.no_ar ? 'no ar agora' : 'fora do ar']);
  if (tl) fatos.push(['No telão', tl.preta ? 'Tela preta' : (tl.vazio ? 'Nada no telão' : (tl.nome || 'Apresentação')),
    tl.preta ? 'o telão está escuro de propósito' : (tl.vazio || tl.slide == null ? '' : 'slide ' + tl.slide + ' de ' + tl.total)]);
  if (lz) {
    const cena = (lz.cenas || []).find(c => c.id === lz.cena);
    const modo = (lz.modos || []).find(m => m.id === lz.modo);
    fatos.push(['Na luz', lz.cena === 'apagar' ? 'Apagada' : (cena ? cena.nome : 'Cena montada à mão'),
      lz.modo === 'parado' ? 'parada' : 'movimento ' + (modo ? modo.nome.toLowerCase() : lz.modo)]);
  }
  if (fatos.length) html += '<div class="fatos">' + fatos.map(f =>
    '<div class="fato"><span class="rotulo">' + f[0] + '</span><strong>' + esc(f[1]) + '</strong><span>' + esc(f[2]) + '</span></div>').join('') + '</div>';
  if (tr && tr.preparada && d.controles && d.controles.cortar) {
    html += '<div class="faixa aviso"><span><b>' + esc(tr.preparada) + '</b> está pronta, mas ainda não entrou na transmissão.</span>' +
      botao('Pôr no ar', {tipo: 'cortar'}, {classe: 'bt aviso'}) + '</div>';
  }
  if (proximo) {
    const conf = proximo.confirmar ? {titulo: 'Ir para "' + proximo.nome + '"?', texto: proximo.resumo || 'Este momento pede confirmação.', sim: 'Sim, ir'} : null;
    html += botao('<span class="a"><small>' + (atual ? 'Próximo' : 'Começar por') + '</small><b>' + esc(proximo.nome) + '</b></span>' +
      '<span class="b">' + esc(proximo.resumo || '') + '</span>',
      {tipo: 'ir', momento: proximo.id, versao: ordem.versao}, {classe: 'proximo', confirmar: conf});
  } else if (momentos.length) {
    html += '<button type="button" class="proximo fim" disabled><span class="a"><small>Fim</small><b>A ordem terminou</b></span></button>';
  }
  pintar('agora', html);

  // ORDEM
  let o = '';
  if (momentos.length) {
    o = '<div class="cabeca" style="justify-content:flex-start"><h2 class="rotulo">Ordem do culto</h2>' +
      '<span class="miudo">toque num momento para ir direto a ele</span></div><div class="momentos">' +
      momentos.map((m, i) => {
        const eAtual = i === ordem.atual, feito = ordem.atual != null && i < ordem.atual;
        const classe = 'momento' + (eAtual ? ' atual' : feito ? ' feito' : m.confirmar ? ' serio' : '');
        const etiqueta = (i + 1) + (eAtual ? ' · agora' : feito ? ' · feito' : m.id === ordem.proximo_id ? ' · próximo' : m.confirmar ? ' · pede confirmação' : '');
        const conf = (m.confirmar || feito) ? {
          titulo: (feito ? 'Voltar para "' : 'Ir para "') + m.nome + '"?',
          texto: m.resumo || '', sim: 'Sim, ir'} : null;
        return botao('<small>' + etiqueta + '</small><b>' + esc(m.nome) + '</b>',
          {tipo: 'ir', momento: m.id, versao: ordem.versao}, {classe: classe, confirmar: conf, atual: eAtual});
      }).join('') + '</div>';
  } else {
    o = '<div class="faixa aviso"><span>Nenhuma ordem de culto carregada. ' +
      (d.local ? 'Escolha uma em <b>Mais</b>, ou comece pela chegada.' : 'Isso se escolhe no PC da igreja.') + '</span></div>';
  }
  pintar('ordem', o);

  // HISTORICO
  const h = d.historico || [];
  const ultimo = h[0];
  const aberto = $('historico').open;
  pintar('historico', '<summary>' +
    (ultimo ? '<i aria-hidden="true" class="' + (ultimo.ok ? '' : 'ruim') + '"></i><span><b style="color:var(--texto)">' +
      esc(ultimo.hora) + ' · ' + esc(ultimo.titulo) + '</b> — ' + esc(ultimo.detalhe) + (ultimo.origem === 'web' ? ' (pela web)' : '') + '</span>'
      : '<span>Nada foi acionado ainda.</span>') +
    (h.length > 1 ? '<em>Ver o que aconteceu</em>' : '') + '</summary>' +
    (h.length > 1 ? '<ol>' + h.slice(1).map(e => '<li class="' + (e.ok ? '' : 'ruim') + '"><b style="color:var(--texto)">' +
      esc(e.hora) + ' · ' + esc(e.titulo) + '</b> — ' + esc(e.detalhe) + (e.origem === 'web' ? ' (pela web)' : '') + '</li>').join('') + '</ol>' : ''));
  $('historico').open = aberto;

  desenharTransmissao(d);
  desenharLuz(d);
  desenharTelao(d);
}

function desenharFaixas(d) {
  const f = [];
  if (semContato > 2) {
    f.push('<div class="faixa erro"><span><b>Perdi o contato com a ponte.</b> ' +
      (d && d.local === false ? 'Confira a internet deste aparelho.' : 'A janela preta ainda está aberta no PC?') + '</span></div>');
  }
  if (d.erro) f.push('<div class="faixa erro"><span>' + esc(d.erro) + '</span></div>');
  if (d.local === false && d.viva && d.remoto && !d.remoto.aceita) {
    f.push('<div class="faixa aviso"><span><b>Só para acompanhar.</b> Os comandos pela web estão desligados no PC da igreja.</span></div>');
  }
  (d.sistemas || []).filter(s => s.estado === 'erro').forEach(s =>
    f.push('<div class="faixa aviso"><span><b>' + esc(s.nome) + ':</b> ' + esc(s.detalhe) + '</span></div>'));
  const at = d.atualizacao;
  if (d.local && at) {
    if (at.aplicando) f.push('<div class="faixa nota"><span><b>Atualizando.</b> A ponte vai sumir por alguns segundos e voltar sozinha.</span></div>');
    else if (at.disponivel) f.push('<div class="faixa nota"><span><b>Há uma atualização da Ponte.</b> Leva menos de um minuto; a tela some e volta sozinha.</span>' +
      '<button type="button" class="bt forte" id="bt-atualizar"' + (ocupado ? ' disabled' : '') + '>Atualizar agora</button></div>');
  }
  pintar('faixas', f.join(''));
}

function desenharMenu(d) {
  const local = !!d.local;
  let m = '';
  m += '<a href="' + (local ? '/aqui' : '/chegada') + '">Chegada: preparar o culto</a>';
  if (local) {
    m += '<a href="/letras">Letras do dia</a><a href="/youtube">Transmissão no YouTube</a>' +
      '<a href="/cenas">Montar uma cena de luz</a><a href="/estudio">Estúdio de luz: testar ideias</a>' +
      '<a href="/baixar">Baixar o projeto para outro PC</a>';
    if ((d.ordens || []).length) {
      m += '<label>Ordem do culto de hoje<select id="troca-ordem">' + d.ordens.map(o =>
        '<option value="' + esc(o.id) + '"' + (d.ordem && o.id === d.ordem.id ? ' selected' : '') + '>' + esc(o.nome) + '</option>').join('') + '</select></label>';
    }
    const at = d.atualizacao || {};
    m += '<div class="bloco"><span class="miudo">Versão deste PC: ' + esc(at.aqui || '?') +
      (at.erro ? ' · não consegui falar com a versão web' : at.disponivel ? ' · há uma mais nova' : at.la ? ' · é a mais nova' : '') + '</span>' +
      '<button type="button" class="bt" id="bt-conferir">Procurar atualização</button></div>';
    m += '<div class="bloco"><span class="miudo">Painel na web</span><div class="par">' +
      '<button type="button" data-remoto="1" aria-pressed="' + (d.remoto && d.remoto.aceita ? 'true' : 'false') + '">Aceita comandos</button>' +
      '<button type="button" data-remoto="0" aria-pressed="' + (d.remoto && d.remoto.aceita ? 'false' : 'true') + '">Só mostra</button></div></div>';
  } else {
    m += '<a href="/instalar">Instalar a ponte num PC</a><a href="/sair">Sair</a>';
  }
  const pcs = d.maquinas || [];
  if (pcs.length) {
    const la = d.atualizacao && d.atualizacao.la || d.versao_da_web;
    m += '<div class="bloco"><span class="miudo">PCs da igreja</span><div class="pcs">' + pcs.map(p =>
      '<span><b>' + esc(p.nome) + '</b> — ' + (p.viva ? 'ligado' : 'sem resposta') +
      (p.versao ? (la && p.versao !== la ? ', precisa atualizar' : ', atualizado') : '') + '</span>').join('') + '</div></div>';
  }
  const aberto = $('menu').open;
  pintar('folha', m);
  $('menu').open = aberto;
}

function desenharTransmissao(d) {
  const t = d.transmissao, c = d.controles || {};
  mostrar('cartao-transmissao', !!t);
  if (!t) return;
  let h = '<div class="cabeca"><h2>Transmissão</h2>' + (t.no_ar
    ? '<span class="selo vivo"><i aria-hidden="true"></i>NO AR' + (t.tempo_ms != null ? ' · ' + tempo(t.tempo_ms) : '') + '</span>'
    : '<span class="selo fora">Fora do ar</span>') + '</div>';
  const y = t.youtube;
  if (y) {
    h += '<div style="display:flex;flex-direction:column;gap:5px"><span class="miudo umalinha" title="' + esc(y.titulo || '') + '">Quem pode assistir' +
      (y.titulo ? ' · ' + esc(y.titulo) : '') + '</span><div class="par">' +
      botao('Só com o link', {tipo: 'visibilidade', valor: 'unlisted'}, {classe: '', apertado: !y.publica}) +
      botao('Público', {tipo: 'visibilidade', valor: 'public'}, {classe: '', apertado: !!y.publica,
        confirmar: y.publica ? null : {titulo: 'Abrir a transmissão ao público?', texto: 'Qualquer pessoa vai poder assistir e ela aparece no canal.', sim: 'Sim, abrir'}}) +
      '</div></div>';
  } else if (d.local) {
    h += '<span class="miudo">Título, link e quem pode assistir ficam em <a href="/youtube">Transmissão no YouTube</a>.</span>';
  }
  const botoes = [];
  if (y && y.link) botoes.push('<button type="button" class="bt" data-copiar="' + esc(y.link) + '">Copiar o link</button>');
  if (c.transmitir) {
    botoes.push(t.no_ar
      ? botao('Parar transmissão', {tipo: 'transmitir', ligar: false}, {classe: 'bt perigo',
          confirmar: {titulo: 'Parar a transmissão?', texto: 'Quem está assistindo pela internet deixa de ver o culto.', sim: 'Sim, parar', perigo: true}})
      : botao('Iniciar transmissão', {tipo: 'transmitir', ligar: true}, {classe: 'bt forte',
          confirmar: {titulo: 'Iniciar a transmissão?', texto: 'O culto começa a ir para a internet agora.', sim: 'Sim, iniciar'}}));
  }
  if (botoes.length) h += '<div class="grade ' + (botoes.length > 1 ? 'g2' : '') + '">' + botoes.join('') + '</div>';
  if (c.gravar) {
    h += '<div class="linha corte"><span>Gravação <b>' + (t.gravando ? 'ligada' : 'desligada') + '</b></span>' + (t.gravando
      ? botao('Parar de gravar', {tipo: 'gravar', ligar: false}, {confirmar: {titulo: 'Parar de gravar?', texto: 'O arquivo da gravação é fechado.', sim: 'Sim, parar', perigo: true}})
      : botao('Começar a gravar', {tipo: 'gravar', ligar: true})) + '</div>';
  }
  pintar('cartao-transmissao', h);
}

function desenharLuz(d) {
  const l = d.luz;
  mostrar('cartao-luz', !!l);
  if (!l) return;
  let h = '<div class="cabeca"><h2>Luz</h2><span style="display:flex;align-items:center;gap:12px">' +
    (d.local ? '<a href="/cenas" style="font-size:13.5px;font-weight:600;padding:8px 2px">Montar uma cena</a>' : '') +
    botao('Apagar tudo', {tipo: 'apagar_luz'}, {classe: 'bt',
      confirmar: {titulo: 'Apagar todas as luzes?', texto: 'O palco fica escuro até alguém escolher uma cena.', sim: 'Sim, apagar', perigo: true}}) +
    '</span></div>';
  if ((l.cenas || []).length) {
    h += '<div class="grade g3">' + l.cenas.map(c =>
      botao(esc(c.nome), {tipo: 'cena_luz', cena: c.id}, {classe: 'escolha', apertado: c.id === l.cena})).join('') + '</div>';
  } else {
    h += '<span class="miudo">Ainda não há cenas de luz salvas.</span>';
  }
  if ((l.modos || []).length) {
    const atual = l.modos.find(m => m.id === l.modo);
    h += '<details class="dobra" id="dobra-movimento"' + (movimentoAberto ? ' open' : '') + '>' +
      '<summary><span>Movimento: <b>' + esc(atual ? atual.nome : 'Parado') + '</b></span><em>' + (movimentoAberto ? 'fechar' : 'trocar') + '</em></summary>' +
      '<div class="grade g3">' +
      botao('Parado', {tipo: 'modo_luz', modo: 'parado'}, {classe: 'escolha', apertado: l.modo === 'parado'}) +
      l.modos.map(m => '<span title="' + esc(m.descricao || '') + '" style="display:contents">' +
        botao(esc(m.nome), {tipo: 'modo_luz', modo: m.id}, {classe: 'escolha', apertado: m.id === l.modo}) + '</span>').join('') + '</div></details>';
  }
  pintar('cartao-luz', h);
}

function desenharTelao(d) {
  const t = d.telao, c = d.controles || {}, recados = d.recados || [], rt = d.retorno_tv;
  const tem = (t && c.tela_preta) || recados.length > 0 || !!rt;
  mostrar('cartao-telao', !!tem);
  if (!tem) return;
  let h = '<h2>Telão e palco</h2>';
  if (rt) {
    // A TV do altar. O vigia reabre sozinho quando ela solta o retorno; aqui
    // a pessoa ve o que ele esta fazendo e pode reabrir ou pausar.
    const ruim = ['caiu', 'reconectando', 'desistiu', 'fora_da_janela'].indexOf(rt.estado) >= 0;
    h += '<div style="display:flex;flex-direction:column;gap:6px"><span style="font-size:14px;color:' +
      (ruim ? 'var(--aviso-texto)' : 'var(--suave)') + '">TV do altar: <b' + (ruim ? ' style="color:#fff"' : '') + '>' + esc(rt.texto) + '</b></span>' +
      '<div class="grade g2">' +
      botao(rt.estado === 'no_ar' ? 'Reabrir o retorno' : 'Abrir o retorno', {tipo: 'retorno', acao: 'reabrir'},
        {confirmar: rt.estado === 'no_ar' ? {titulo: 'Reabrir o retorno na TV?', texto: 'A TV já está recebendo a letra. Reabrir faz a imagem sumir por uns 20 segundos.', sim: 'Reabrir'} : null}) +
      (rt.pausado
        ? botao('Voltar a vigiar', {tipo: 'retorno', acao: 'retomar'}, {classe: 'bt forte'})
        : botao('Pausar o vigia', {tipo: 'retorno', acao: 'pausar'},
            {confirmar: {titulo: 'Pausar o vigia do retorno?', texto: 'Até o fim do dia, a ponte não reabre o retorno sozinha se a TV soltar.', sim: 'Pausar'}})) +
      '</div></div>';
    if ((t && c.tela_preta) || recados.length) h += '<div class="corte" style="padding-top:0"></div>';
  }
  if (t && c.tela_preta) {
    h += '<div class="linha"><span>Telão <b>' + (t.preta ? 'escuro' : 'mostrando') + '</b></span>' + (t.preta
      ? botao('Voltar a mostrar', {tipo: 'tela_preta', ligar: false}, {classe: 'bt forte'})
      : botao('Deixar a tela preta', {tipo: 'tela_preta', ligar: true})) + '</div>';
  }
  if (recados.length) {
    h += '<div class="' + (t && c.tela_preta ? 'corte' : '') + '" style="display:flex;flex-direction:column;gap:6px">' +
      '<span class="miudo">Recado para quem está no palco</span><div class="grade g2">' +
      recados.map(r => botao(esc(r.nome), {tipo: 'recado', id: r.id})).join('') +
      (d.tem_recado_limpar ? botao('Tirar o recado', {tipo: 'recado', id: 'recado_limpar'}) : '') + '</div></div>';
  }
  pintar('cartao-telao', h);
}

// ------------------------------------------------------------------- agir --
let avisoRelogio = null;
function avisar(texto, ruim) {
  const a = $('aviso');
  a.textContent = texto;
  a.className = 'aviso-flutuante' + (ruim ? ' ruim' : '');
  a.hidden = false;
  clearTimeout(avisoRelogio);
  avisoRelogio = setTimeout(() => { a.hidden = true; }, ruim ? 7000 : 3500);
}

function perguntar(c) {
  return new Promise(resolver => {
    const dlg = $('dialogo');
    $('dialogo-titulo').textContent = c.titulo;
    $('dialogo-texto').textContent = c.texto || '';
    $('dialogo-sim').textContent = c.sim || 'Confirmar';
    $('dialogo-sim').className = 'bt ' + (c.perigo ? 'perigo' : 'forte');
    const fechar = resposta => { dlg.close(); $('dialogo-sim').onclick = $('dialogo-nao').onclick = dlg.oncancel = null; resolver(resposta); };
    $('dialogo-sim').onclick = () => fechar(true);
    $('dialogo-nao').onclick = () => fechar(false);
    dlg.oncancel = e => { e.preventDefault(); fechar(false); };
    dlg.showModal();
    $('dialogo-nao').focus();
  });
}

async function pedir(caminho, corpo) {
  const r = await fetch(caminho, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(corpo || {})});
  let j = {};
  try { j = await r.json(); } catch (e) { /* resposta sem corpo */ }
  if (r.status === 401) { location.href = '/entrar'; throw new Error('entre com a senha'); }
  if (!r.ok) throw new Error(j.erro || ('erro ' + r.status));
  return j;
}

async function agir(acao) {
  if (ocupado) return;
  ocupado = true; redesenhar();
  try {
    const j = await pedir('/api/painel/acao', acao);
    if (j.enviado) avisar('Pedido enviado para a igreja. Acompanhe na tela.');
    else if (j.ok === false) avisar(j.titulo + ': ' + j.detalhe, true);
    else avisar(j.titulo || 'Feito');
  } catch (erro) {
    avisar(erro.message, true);
  }
  ocupado = false;
  await consultar();
}

function redesenhar() {
  Object.keys(jaPintado).forEach(k => delete jaPintado[k]);
  if (D) desenhar();
}

document.addEventListener('click', async evento => {
  const alvo = evento.target.closest('button');
  if (!alvo || alvo.disabled) return;
  if (alvo.dataset.acao) {
    if (alvo.dataset.confirmar && !(await perguntar(JSON.parse(alvo.dataset.confirmar)))) return;
    agir(JSON.parse(alvo.dataset.acao));
  } else if (alvo.dataset.copiar) {
    try { await navigator.clipboard.writeText(alvo.dataset.copiar); avisar('Link copiado.'); }
    catch (e) { avisar('Não consegui copiar. O link é: ' + alvo.dataset.copiar, true); }
  } else if (alvo.dataset.remoto != null) {
    const aceita = alvo.dataset.remoto === '1';
    if (!aceita || await perguntar({titulo: 'Aceitar comandos pela web?', texto: 'Quem entrar no painel da web com a senha da equipe vai poder mudar o culto de fora da igreja.', sim: 'Sim, aceitar'})) {
      try { await pedir('/api/painel/remoto', {aceita: aceita}); } catch (erro) { avisar(erro.message, true); }
      consultar();
    }
  } else if (alvo.id === 'bt-conferir') {
    try {
      const a = await pedir('/api/atualizacao/conferir');
      avisar(a.erro ? 'Não consegui falar com a versão web. Este PC está com internet?' : a.disponivel ? 'Há uma atualização. O botão está no alto da tela.' : 'Este PC já está na versão mais nova.', !!a.erro);
    } catch (erro) { avisar(erro.message, true); }
    consultar();
  } else if (alvo.id === 'bt-atualizar') {
    if (await perguntar({titulo: 'Atualizar a Ponte agora?', texto: 'A ponte deste PC some por alguns segundos e volta sozinha. Não faça isso no meio de um momento do culto.', sim: 'Atualizar'})) {
      try { await pedir('/api/painel/atualizar'); avisar('Atualizando. A tela volta sozinha.'); }
      catch (erro) { avisar(erro.message, true); }
      consultar();
    }
  }
});
// A lista de movimentos lembra se estava aberta: a tela e redesenhada a cada
// 2 segundos, e sem isto ela fecharia sozinha na mao de quem esta escolhendo.
document.addEventListener('toggle', evento => {
  if (evento.target.id !== 'dobra-movimento') return;
  movimentoAberto = evento.target.open;
  redesenhar();
}, true);
document.addEventListener('change', async evento => {
  if (evento.target.id !== 'troca-ordem') return;
  const sel = evento.target, nome = sel.options[sel.selectedIndex].text;
  if (await perguntar({titulo: 'Trocar para "' + nome + '"?', texto: 'A ordem do culto recomeça do primeiro momento.', sim: 'Trocar'})) agir({tipo: 'ordem', id: sel.value});
  else redesenhar();
});
document.addEventListener('click', evento => {
  const menu = $('menu');
  if (menu.open && !menu.contains(evento.target)) menu.open = false;
});

// -------------------------------------------------------------- consultar --
async function consultar() {
  try {
    const r = await fetch('/api/painel', {cache: 'no-store'});
    if (r.status === 401) { location.href = '/entrar'; return; }
    if (!r.ok) throw new Error('erro ' + r.status);
    D = await r.json();
    semContato = 0;
  } catch (erro) {
    semContato++;
    if (!D) D = {ordem: {momentos: []}, sistemas: []};
  }
  // Com um dialogo aberto ou alguem escolhendo no menu, a tela nao muda
  // embaixo do dedo da pessoa.
  if ($('dialogo').open || document.activeElement && document.activeElement.id === 'troca-ordem') return;
  desenhar();
}
consultar();
setInterval(consultar, 2000);
</script>
