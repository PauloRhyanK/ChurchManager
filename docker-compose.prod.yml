# Produção: API + Postgres + pgAdmin. Rede externa `proxy-network` (ex.: NPM).
# 1) Copia `.env.example` → `.env` e preenche segredos, API_IMAGE, ADMIN_CORS_ORIGIN, etc.
# 2) Na VPS: docker compose -f docker-compose.prod.yml up -d
#
# pgAdmin — leitura OBRIGATÓria (imagem oficial dpage/pgadmin4):
# PGADMIN_DEFAULT_EMAIL / PGADMIN_DEFAULT_PASSWORD só definem o login na PRIMEIRA vez que o
# contentor cria a base em /var/lib/pgadmin. Depois disso ficam guardados no VOLUME Docker
# `pgadmin_data`. Mudar o `.env` NÃO altera email/senha já criados.
#
# Se o login falhar com credenciais “certas” no .env:
#   1) Tenta primeiro o login que foi usado na primeira subida (ex.: admin@example.com / admin).
#   2) Para forçar o .env atual: para o pgadmin, apaga o volume, sobe de novo.
#      Nome real do volume: `docker volume ls` → procura `pgadmin_data` (ex.: churchmanager_pgadmin_data).
#      docker compose -f docker-compose.prod.yml stop pgadmin
#      docker volume rm <nome_completo_do_volume>
#      docker compose -f docker-compose.prod.yml up -d

services:
  api:
    image: "${API_IMAGE:?Defina API_IMAGE no .env. Ver .env.example e docker/README.md}"
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
    restart: unless-stopped
    depends_on:
      - db
    networks:
      - default
      - proxy-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s

  db:
    image: postgres:15-alpine
    container_name: churchmanager_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SenhaSuperForte123}
      POSTGRES_DB: ${POSTGRES_DB:-churchmanager_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - default

  # NPM: Forward Hostname = churchmanager_pgadmin, Porta = 80
  # No pgAdmin → Register Server: Host = db, Port = 5432, user/pass = POSTGRES_USER / POSTGRES_PASSWORD (.env)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: churchmanager_pgadmin
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - .env
    environment:
      PGADMIN_CONFIG_SERVER_MODE: "True"
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - default
      - proxy-network

networks:
  default:
  proxy-network:
    external: true

volumes:
  pgdata:
  pgadmin_data:
