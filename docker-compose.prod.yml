# Stack de produção: API + Postgres + pgAdmin (opcional, para NPM na proxy-network).
# Uso: docker compose -f docker-compose.prod.yml up -d
# Defina API_IMAGE e `.env.production` com segredos (não commitado). Rede externa `proxy-network` (ex.: NPM).

services:
  api:
    image: ${API_IMAGE:-church-manager-api:latest}
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
    restart: unless-stopped
    depends_on:
      - db
    networks:
      - default
      - proxy-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s

  db:
    image: postgres:15-alpine
    container_name: churchmanager_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: SenhaSuperForte123
      POSTGRES_DB: churchmanager_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - default

  # pgAdmin 4 — UI na porta 80 do contentor. No NPM: Forward Hostname = churchmanager_pgadmin, Forward Port = 80.
  # No pgAdmin, regista o servidor Postgres com Host = db (nome do serviço na rede Docker), Port = 5432.
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: churchmanager_pgadmin
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - .env.production
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-change-me-in-env}
      PGADMIN_CONFIG_SERVER_MODE: "True"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - default
      - proxy-network

networks:
  default:
  proxy-network:
    external: true

volumes:
  pgdata:
  pgadmin_data: