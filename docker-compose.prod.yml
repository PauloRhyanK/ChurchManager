# Produção: API + Postgres + pgAdmin. Rede externa `proxy-network` (ex.: NPM).
# 1) Copia `.env.production.example` → `.env.production` e preenche POSTGRES_*, ENCRYPTION_KEY, JWT_SECRET, etc.
# 2) Na VPS: `docker compose --env-file .env.production -f docker-compose.prod.yml up -d`
#    (assim POSTGRES_* e API_IMAGE são lidos na interpolação; alternativa: mesmas chaves num `.env` na raiz.)
#
# Login pgAdmin: PGADMIN_DEFAULT_EMAIL / PGADMIN_DEFAULT_PASSWORD no `.env.production`
# (env_file no serviço pgadmin — não depende de `--env-file` no compose).
# Se mudares email/senha e o login falhar, apaga o volume `pgadmin_data` (só apaga dados da UI pgAdmin).

services:
  api:
    image: ${API_IMAGE:-church-manager-api:latest}
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-SenhaSuperForte123}@db:5432/${POSTGRES_DB:-churchmanager_db}
    restart: unless-stopped
    depends_on:
      - db
    networks:
      - default
      - proxy-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s

  db:
    image: postgres:15-alpine
    container_name: churchmanager_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SenhaSuperForte123}
      POSTGRES_DB: ${POSTGRES_DB:-churchmanager_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - default

  # NPM: Forward Hostname = churchmanager_pgadmin, Porta = 80
  # No pgAdmin → Register Server: Host = db, Port = 5432, user/pass = POSTGRES_USER / POSTGRES_PASSWORD (.env.production)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: churchmanager_pgadmin
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - .env.production
    environment:
      PGADMIN_CONFIG_SERVER_MODE: "True"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - default
      - proxy-network

networks:
  default:
  proxy-network:
    external: true

volumes:
  pgdata:
  pgadmin_data:
