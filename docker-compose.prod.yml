# Produção: API + Postgres + pgAdmin. Rede externa `proxy-network` (ex.: NPM).
# 1) Copia `.env.example` → `.env` e preenche segredos, API_IMAGE, ADMIN_CORS_ORIGIN, etc.
# 2) Na VPS: docker compose -f docker-compose.prod.yml up -d
#
# pgAdmin — leitura OBRIGATÓria (imagem oficial dpage/pgadmin4):
# PGADMIN_DEFAULT_EMAIL / PGADMIN_DEFAULT_PASSWORD só definem o login na PRIMEIRA vez que o
# contentor cria a base em /var/lib/pgadmin. Depois disso ficam guardados no VOLUME Docker
# `pgadmin_data`. Mudar o `.env` NÃO altera email/senha já criados.
#
# Se o login falhar com credenciais “certas” no .env:
#   1) Tenta primeiro o login que foi usado na primeira subida (ex.: admin@example.com / admin).
#   2) Para forçar o .env atual: para o pgadmin, apaga o volume, sobe de novo.
#      Nome real do volume: `docker volume ls` → procura `pgadmin_data` (ex.: churchmanager_pgadmin_data).
#      docker compose -f docker-compose.prod.yml stop pgadmin
#      docker volume rm <nome_completo_do_volume>
#      docker compose -f docker-compose.prod.yml up -d

services:
  api:
    image: "${API_IMAGE:?Defina API_IMAGE no .env. Ver .env.example e docker/README.md}"
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
    restart: unless-stopped
    depends_on:
      - db
    networks:
      - default
      - proxy-network
    # Contorno de rede: a VPS não tem rota até 216.198.79.1 (IP atual do DNS de
    # igrejaparaiso.com.br na Vercel), e a revalidação do site dava timeout.
    # 76.76.21.21 também é da Vercel e serve o site; o TLS continua validado pelo domínio.
    # Remover quando o provedor da VPS corrigir a rota para 216.198.79.0/24
    # (teste: `curl -m 10 https://igrejaparaiso.com.br` a partir do host).
    extra_hosts:
      - "igrejaparaiso.com.br:76.76.21.21"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s

  db:
    image: postgres:15-alpine
    container_name: churchmanager_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SenhaSuperForte123}
      POSTGRES_DB: ${POSTGRES_DB:-churchmanager_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - default

  # Backup diário do Postgres (pg_dump às 02:00, America/Sao_Paulo, mais um na subida).
  # Dumps em /root/backups/churchmanager no host, 14 dias de retenção local.
  # Detalhes, restauração e rotina da Locaweb: docs/backup.md
  db-backup:
    image: postgres:15-alpine
    container_name: churchmanager_db_backup
    restart: unless-stopped
    depends_on:
      - db
    environment:
      TZ: America/Sao_Paulo
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-churchmanager_db}
      BACKUP_DIR: /backups
      BACKUP_KEEP_DAYS: "14"
    volumes:
      - ./docker/backup:/scripts:ro
      - /root/backups/churchmanager:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        i=0
        until pg_isready -q || [ "$$i" -ge 30 ]; do i=$$((i+1)); sleep 2; done
        /scripts/pg-backup.sh || echo "[backup] $$(date '+%Y-%m-%d %H:%M:%S') ERRO: backup inicial falhou"
        echo '0 2 * * * /scripts/pg-backup.sh >> /proc/1/fd/1 2>&1' > /etc/crontabs/root
        exec crond -f -l 8
    healthcheck:
      test: ["CMD-SHELL", "find /backups -maxdepth 1 -name 'churchmanager-*.dump' -mmin -1560 | grep -q ."]
      interval: 1h
      timeout: 10s
      retries: 1
      start_period: 5m
    networks:
      - default

  # NPM: Forward Hostname = churchmanager_pgadmin, Porta = 80
  # No pgAdmin → Register Server: Host = db, Port = 5432, user/pass = POSTGRES_USER / POSTGRES_PASSWORD (.env)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: churchmanager_pgadmin
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - .env
    environment:
      PGADMIN_CONFIG_SERVER_MODE: "True"
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - default
      - proxy-network

networks:
  default:
  proxy-network:
    external: true

volumes:
  pgdata:
  pgadmin_data:
