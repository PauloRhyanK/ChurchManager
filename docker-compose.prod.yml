# Produção: API + Postgres + pgAdmin. Rede externa `proxy-network` (ex.: NPM).
# 1) Copia `.env.production.example` → `.env.production` e preenche POSTGRES_*, ENCRYPTION_KEY, JWT_SECRET, etc.
# 2) Na VPS (obrigatório --env-file para API_IMAGE): `docker compose --env-file .env.production -f docker-compose.prod.yml up -d`
#    (assim POSTGRES_* e API_IMAGE são lidos na interpolação; alternativa: mesmas chaves num `.env` na raiz.)
#
# pgAdmin — leitura OBRIGATÓria (imagem oficial dpage/pgadmin4):
# PGADMIN_DEFAULT_EMAIL / PGADMIN_DEFAULT_PASSWORD só definem o login na PRIMEIRA vez que o
# contentor cria a base em /var/lib/pgadmin. Depois disso ficam guardados no VOLUME Docker
# `pgadmin_data`. Mudar o `.env.production` NÃO altera email/senha já criados.
#
# Se o login falhar com credenciais “certas” no .env:
#   1) Tenta primeiro o login que foi usado na primeira subida (ex.: admin@example.com / admin).
#   2) Para forçar o .env atual: para o pgadmin, apaga o volume, sobe de novo.
#      Nome real do volume: `docker volume ls` → procura `pgadmin_data` (ex.: churchmanager_pgadmin_data).
#      docker compose -f docker-compose.prod.yml stop pgadmin
#      docker volume rm <nome_completo_do_volume>
#      docker compose --env-file .env.production -f docker-compose.prod.yml up -d

services:
  api:
    # Interpolação: lê API_IMAGE do ambiente do processo `docker compose` ou de `--env-file`.
    # NÃO vem de `env_file:` abaixo (isso só entra no contentor). Sem API_IMAGE definida aqui,
    # o Compose falha com mensagem clara — evita pull de `church-manager-api:latest` por engano.
    image: "${API_IMAGE:?Defina API_IMAGE e passe --env-file .env.production ao docker compose. Ver .env.production.example e docker/README.md}"
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-SenhaSuperForte123}@db:5432/${POSTGRES_DB:-churchmanager_db}
    restart: unless-stopped
    depends_on:
      - db
    networks:
      - default
      - proxy-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s

  db:
    image: postgres:15-alpine
    container_name: churchmanager_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SenhaSuperForte123}
      POSTGRES_DB: ${POSTGRES_DB:-churchmanager_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - default

  # NPM: Forward Hostname = churchmanager_pgadmin, Porta = 80
  # No pgAdmin → Register Server: Host = db, Port = 5432, user/pass = POSTGRES_USER / POSTGRES_PASSWORD (.env.production)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: churchmanager_pgadmin
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - .env.production
    environment:
      PGADMIN_CONFIG_SERVER_MODE: "True"
      # Atrás do NPM/proxy; senão cookies podem falhar no login (documentação pgAdmin / reverse proxy).
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - default
      - proxy-network

networks:
  default:
  proxy-network:
    external: true

volumes:
  pgdata:
  pgadmin_data:
