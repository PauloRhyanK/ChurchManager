name: API — CI/CD

on:
  push:
    paths:
      - "apps/api/**"
      - ".github/workflows/api-ci-cd.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - ".github/workflows/api-ci-cd.yml"
  workflow_dispatch:

concurrency:
  group: api-ci-cd-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  # Apenas para `prisma generate` no CI (não é usada para conectar a um servidor real).
  DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public

defaults:
  run:
    working-directory: apps/api

jobs:
  ci:
    name: Testar e compilar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Validar schema Prisma
        run: npx prisma validate

      - name: Gerar cliente Prisma
        run: npx prisma generate

      - name: Compilar (NestJS)
        run: npm run build

      - name: Testes
        run: npm test

  docker:
    name: Publicar imagem (GHCR)
    runs-on: ubuntu-latest
    needs: ci
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name == 'workflow_dispatch' ||
       github.ref == 'refs/heads/main' ||
       startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Nome da imagem (minúsculas para GHCR)
        id: image
        run: |
          owner_repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${owner_repo}/api" >> "$GITHUB_OUTPUT"

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadados e tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Secrets: SSH_HOST, SSH_USER, SSH_PRIVATE_KEY (chave privada PEM com acesso SSH à VPS).
  # Na VPS: git pull precisa de acesso ao repo; docker pull do GHCR precisa de login ghcr.io (read:packages).
  deploy:
    name: Deploy na VPS
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # O script para no primeiro erro: antes, um `pull` que caía no meio
          # (ex.: "connection reset by peer" no GHCR) deixava a imagem antiga a
          # correr e o passo terminava verde.
          command_timeout: 20m
          script: |
            set -eu
            cd ~/projetos/churchmanager
            git pull origin main
            COMPOSE="sudo docker compose -f docker-compose.prod.yml"

            # O download do GHCR às vezes cai a meio: tenta de novo antes de desistir.
            tentativa=1
            until $COMPOSE pull api; do
              if [ "$tentativa" -ge 5 ]; then
                echo "ERRO: não foi possível baixar a imagem da API após $tentativa tentativas."
                exit 1
              fi
              echo "Download da imagem falhou (tentativa $tentativa); nova tentativa em 20s…"
              tentativa=$((tentativa + 1))
              sleep 20
            done

            $COMPOSE up -d api

            # Só dá sucesso se o contêiner estiver na imagem recém-baixada e saudável.
            CID=$($COMPOSE ps -q api)
            REF=$(sudo docker inspect --format '{{.Config.Image}}' "$CID")
            ESPERADA=$(sudo docker image inspect --format '{{.Id}}' "$REF")
            ATUAL=$(sudo docker inspect --format '{{.Image}}' "$CID")
            if [ "$ESPERADA" != "$ATUAL" ]; then
              echo "ERRO: o contêiner da API não está na imagem nova ($ATUAL, esperada $ESPERADA)."
              exit 1
            fi
            echo "Contêiner na imagem $ATUAL; à espera de ficar saudável…"
            i=0
            while :; do
              ESTADO=$(sudo docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$CID")
              case "$ESTADO" in
                healthy) break ;;
                unhealthy|exited|dead)
                  echo "ERRO: a API ficou $ESTADO."
                  $COMPOSE logs --tail 80 api
                  exit 1 ;;
              esac
              i=$((i + 1))
              if [ "$i" -ge 60 ]; then
                echo "ERRO: a API não ficou saudável em 5 minutos (estado: $ESTADO)."
                $COMPOSE logs --tail 80 api
                exit 1
              fi
              sleep 5
            done
            echo "API saudável."
            sudo docker image prune -f
