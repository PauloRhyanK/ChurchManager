name: API — CI/CD

on:
  push:
    paths:
      - "apps/api/**"
      - ".github/workflows/api-ci-cd.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - ".github/workflows/api-ci-cd.yml"
  workflow_dispatch:

concurrency:
  group: api-ci-cd-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  # Apenas para `prisma generate` no CI (não é usada para conectar a um servidor real).
  DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public

defaults:
  run:
    working-directory: apps/api

jobs:
  ci:
    name: Testar e compilar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Validar schema Prisma
        run: npx prisma validate

      - name: Gerar cliente Prisma
        run: npx prisma generate

      - name: Compilar (NestJS)
        run: npm run build

      - name: Testes
        run: npm test

  docker:
    name: Publicar imagem (GHCR)
    runs-on: ubuntu-latest
    needs: ci
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name == 'workflow_dispatch' ||
       github.ref == 'refs/heads/main' ||
       startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Nome da imagem (minúsculas para GHCR)
        id: image
        run: |
          owner_repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${owner_repo}/api" >> "$GITHUB_OUTPUT"

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadados e tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      # Buildx com cache do GitHub Actions: quando só o código muda, a camada de node_modules
      # sai idêntica (mesmo digest) e a VPS baixa só a camada pequena do dist/.
      - name: Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  # Secrets: SSH_HOST (IP da VPS), SSH_USER (root) e SSH_PRIVATE_KEY (chave privada ed25519 só
  # deste deploy, inteira, com as linhas BEGIN/END). A chave pública correspondente fica no
  # ~/.ssh/authorized_keys do SSH_USER na VPS. Na VPS: o git pull precisa de acesso ao repo e o
  # docker pull do GHCR precisa de login no ghcr.io (read:packages), como no deploy à mão.
  #
  # Antes de trocar, a imagem que está rodando ganha a tag api:rollback-AAAAMMDD-HHMMSS (ficam as
  # 3 últimas). Não há volta automática: migrações podem alterar dados, e voltar a imagem pode
  # exigir voltar o banco. Para voltar à mão, ver o comando impresso no fim do log do job.
  deploy:
    name: Deploy na VPS
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: deploy-vps-producao
      cancel-in-progress: false
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            set -eu
            cd ~/projetos/churchmanager
            COMPOSE="sudo docker compose -f docker-compose.prod.yml"
            CONTAINER=churchmanager-api-1

            git pull --ff-only origin main

            # Marca de volta: a imagem que está rodando agora.
            STAMP=$(date +%Y%m%d-%H%M%S)
            TARGET=$($COMPOSE config --images api | head -n1)
            REPO=$(printf '%s' "$TARGET" | sed 's/:[^:/]*$//')
            CURRENT=$(sudo docker inspect --format '{{.Image}}' "$CONTAINER" 2>/dev/null || true)
            if [ -n "$CURRENT" ] && [ -n "$REPO" ]; then
              sudo docker tag "$CURRENT" "$REPO:rollback-$STAMP"
              echo "Marca de volta: $REPO:rollback-$STAMP ($CURRENT)"
            else
              echo "Sem contêiner da API rodando: nada para marcar."
            fi

            $COMPOSE pull api
            $COMPOSE up -d api

            # Espera o healthcheck do compose (até ~6 min; a subida aplica as migrações).
            STATUS=starting
            for i in $(seq 1 72); do
              STATUS=$(sudo docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$CONTAINER" 2>/dev/null || echo ausente)
              [ "$STATUS" = healthy ] && break
              [ "$STATUS" = unhealthy ] && break
              sleep 5
            done
            echo "API: $STATUS"
            if [ "$STATUS" != healthy ]; then
              sudo docker logs --tail 80 "$CONTAINER" || true
              echo "A API não ficou saudável. Para voltar a imagem (confira antes se as migrações novas alteraram dados):"
              echo "  sudo docker tag $REPO:rollback-$STAMP $TARGET && $COMPOSE up -d api"
              exit 1
            fi

            # Limpeza: imagens sem tag e marcas de volta além das 3 mais recentes.
            sudo docker image prune -f
            sudo docker images --format '{{.Repository}}:{{.Tag}}' "$REPO" | grep ':rollback-' | sort -r | tail -n +4 | xargs -r sudo docker rmi || true
