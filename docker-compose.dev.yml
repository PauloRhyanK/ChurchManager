# Dev no servidor Debian (nginx-gateway + rede web_gateway).
# 1) Na VPS: docker network create web_gateway
# 2) Copiar .env.example → .env e preencher ENCRYPTION_KEY, JWT_SECRET, etc.
# 3) /etc/hosts (ou DNS local): api|admin|db.churchmanager.local → IP do nginx-gateway
# 4) Colocar docker/nginx-gateway/nginx.conf no projeto nginx-gateway e recarregar nginx
#
# Arranque: docker compose -f docker-compose.dev.yml up -d --build
# Webhooks Asaas (ngrok): NGROK_AUTHTOKEN no .env → docker compose -f docker-compose.dev.yml --profile tunnel up -d

name: churchmanager-dev

services:
  churchmanager-postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5438:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app_net_dev
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  churchmanager-backend-api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@churchmanager-postgres:5432/${POSTGRES_DB}
      PORT: "3000"
    ports:
      - "127.0.0.1:4060:3000"
    depends_on:
      churchmanager-postgres:
        condition: service_healthy
    networks:
      - app_net_dev
      - web_gateway
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Túnel HTTPS para webhooks Asaas (opcional). Ver docs/webhooks-local-dev-ngrok.md
  churchmanager-ngrok:
    image: ngrok/ngrok:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    depends_on:
      churchmanager-backend-api:
        condition: service_healthy
    env_file:
      - .env
    command: ["http", "--log=stdout", "http://churchmanager-backend-api:3000"]
    ports:
      - "127.0.0.1:4040:4040"
    networks:
      - app_net_dev
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  churchmanager-frontend-admin:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
      args:
        API_URL: ${API_URL}
    env_file:
      - .env
    ports:
      - "127.0.0.1:4061:80"
    depends_on:
      - churchmanager-backend-api
    networks:
      - app_net_dev
      - web_gateway
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  churchmanager-pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "127.0.0.1:5052:80"
    volumes:
      - pgadmin_data_dev:/var/lib/pgadmin
    depends_on:
      churchmanager-postgres:
        condition: service_healthy
    networks:
      - app_net_dev
      - web_gateway
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata_dev:
  pgadmin_data_dev:

networks:
  app_net_dev:
    driver: bridge
  web_gateway:
    external: true  